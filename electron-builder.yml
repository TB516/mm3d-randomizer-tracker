appId: io.github.tb516.mm3d-tracker
productName: MM3D Tracker
directories:
  buildResources: build
files:
  - 'out/**'
  - 'resources/**'
win:
  executableName: mm3d-tracker
  target:
    - portable
portable:
  artifactName: ${name}-${version}-portable.${ext}
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - flatpak
  category: Utility
flatpak:
  # electron-builder 26 defaults to 20.08, which is end-of-life. Both need setting together.
  runtimeVersion: '26.08'
  baseVersion: '26.08'
  # Replaces the defaults, which include read and write access to all of home. The seed can be
  # anywhere, so files are readable but not writable, and the network reaches Azahar.
  finishArgs:
    - --socket=wayland
    - --socket=fallback-x11
    - --share=ipc
    - --device=dri
    - --share=network
    - --filesystem=host:ro
npmRebuild: false
